server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build files never change, so browsers may keep them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every other path is a screen of the single-page app (a reload on /requests/123 must work).
  # index.html names the current hashed files, so it must never be cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
